<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Requests Tracking | Rakt-Setu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hospital.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <div class="app-main">
      <div id="topbar-mount"></div>

      <main class="app-content animate-fade-in">
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Emergency STAT Requisition Tracker</h1>
            <p class="page-header-subtitle">Live GPS and cold-chain courier tracking for high-priority emergency blood dispatches.</p>
          </div>
          <div class="page-header-actions">
            <a href="request-blood.html" class="btn btn-primary btn-sm">+ New STAT Order</a>
          </div>
        </div>

        <div id="emergency-requests-container">
          <!-- Rendered by HospitalEngine.renderEmergencyRequests -->
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/print.js"></script>
  <script src="../js/hospital.js"></script>
  <script>
    (async () => {
      const session = await Guard.requireAuth("HOSPITAL", "login.html");
      if (session) {
      UIComponents.initShell("HOSPITAL", "emergency-requests", "Emergency Tracking");
      await HospitalEngine.renderEmergencyRequests();
    
      }
    })();
  </script>
</body>
</html>
