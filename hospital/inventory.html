<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Blood Inventory | Rakt-Setu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hospital.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <div class="app-main">
      <div id="topbar-mount"></div>

      <main class="app-content animate-fade-in">
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Internal Blood Inventory</h1>
            <p class="page-header-subtitle">Component breakdown across all 8 blood groups (Whole Blood, PRBC, Platelets, Plasma).</p>
          </div>
          <div class="page-header-actions" style="display: flex; gap: 8px;">
            <button class="btn btn-secondary btn-sm" onclick="HospitalEngine.printInventoryAudit()" style="display: inline-flex; align-items: center; gap: 5px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              <span>Print Stock Audit</span>
            </button>
            <a href="request-blood.html" class="btn btn-primary btn-sm">+ Order From Blood Bank</a>
          </div>
        </div>

        <!-- 8-Blood Group Grid -->
        <div class="inventory-grid" id="hospital-inventory-matrix">
          <!-- Rendered by HospitalEngine.renderInventory -->
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/print.js"></script>
  <script src="../js/hospital.js"></script>
  <script>
    (async () => {
      const session = await Guard.requireAuth("HOSPITAL", "login.html");
      if (session) {
      UIComponents.initShell("HOSPITAL", "inventory", "Blood Inventory");
      await HospitalEngine.renderInventory();
    
      }
    })();
  </script>
</body>
</html>
