<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Regional Network | Rakt-Setu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/hospital.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <div class="app-main">
      <div id="topbar-mount"></div>

      <main class="app-content animate-fade-in">
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Regional Emergency Network Radar</h1>
            <p class="page-header-subtitle">Real-time availability across neighboring Level-1 trauma centers and cold-storage depots.</p>
          </div>
          <div class="page-header-actions">
            <span class="topbar-status-chip">
              <span class="status-dot pulse"></span>
              <span>100% Facilities Synchronized</span>
            </span>
          </div>
        </div>

        <div id="emergency-network-list">
          <!-- Rendered by HospitalEngine.renderEmergencyNetwork -->
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/print.js"></script>
  <script src="../js/hospital.js"></script>
  <script>
    (async () => {
      const session = await Guard.requireAuth("HOSPITAL", "login.html");
      if (session) {
      UIComponents.initShell("HOSPITAL", "emergency-network", "Emergency Network");
      await HospitalEngine.renderEmergencyNetwork();
    
      }
    })();
  </script>
</body>
</html>
