<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Storage Inventory | Rakt-Setu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/blood-bank.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <div class="app-main">
      <div id="topbar-mount"></div>

      <main class="app-content animate-fade-in">
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Cold Storage Component Inventory</h1>
            <p class="page-header-subtitle">Temperature-controlled storage management for Whole Blood, Packed RBCs, Platelets, and Frozen Plasma.</p>
          </div>
          <div class="page-header-actions" style="display: flex; gap: 8px; align-items: center;">
            <button class="btn btn-secondary btn-sm" onclick="BloodBankEngine.printInventoryAudit()" style="display: inline-flex; align-items: center; gap: 5px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              <span>Print Stock Audit</span>
            </button>
            <span class="cold-chain-temp-chip"><span class="rack-temp-indicator"></span> 3.8 °C Calibrated</span>
          </div>
        </div>

        <div class="inventory-grid" id="bloodbank-inventory-grid">
          <!-- Rendered by BloodBankEngine.renderInventory -->
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script src="../js/data.js?v=2.3"></script>
  <script src="../js/storage.js?v=2.3"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js?v=2.3"></script>
  <script src="../js/guard.js?v=2.3"></script>
  <script src="../js/components.js?v=2.3"></script>
  <script src="../js/print.js"></script>
  <script src="../js/blood-bank.js?v=2.3"></script>
  <script>
    (async () => {
      const session = await Guard.requireAuth("BLOOD_BANK", "login.html");
      if (session) {
      UIComponents.initShell("BLOOD_BANK", "inventory", "Cold Storage Stock");
      await BloodBankEngine.renderInventory();
    
      }
    })();
  </script>
</body>
</html>
