<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Emergency Network | Rakt-Setu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/blood-bank.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <div class="app-main">
      <div id="topbar-mount"></div>

      <main class="app-content animate-fade-in">
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Regional Depot Network &amp; SOS Alerts</h1>
            <p class="page-header-subtitle">Coordinate inter-depot stock balancing and broadcast urgent shortage alerts to regional partner banks.</p>
          </div>
          <div class="page-header-actions">
            <span class="topbar-status-chip">
              <span class="status-dot pulse"></span>
              <span>Cross-Depot Grid Synchronized</span>
            </span>
          </div>
        </div>

        <div id="bb-emergency-network-list">
          <!-- Rendered by BloodBankEngine.renderEmergencyNetwork -->
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script src="../js/data.js?v=2.3"></script>
  <script src="../js/storage.js?v=2.3"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js?v=2.3"></script>
  <script src="../js/guard.js?v=2.3"></script>
  <script src="../js/components.js?v=2.3"></script>
  <script src="../js/print.js"></script>
  <script src="../js/blood-bank.js?v=2.3"></script>
  <script>
    (async () => {
      const session = await Guard.requireAuth("BLOOD_BANK", "login.html");
      if (session) {
      UIComponents.initShell("BLOOD_BANK", "emergency-network", "Regional SOS Alert");
      await BloodBankEngine.renderEmergencyNetwork();
    
      }
    })();
  </script>
</body>
</html>
